services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      NOTIFICATOR_DB_USER: ${NOTIFICATOR_DB_USER}
      NOTIFICATOR_DB_PASSWORD: ${NOTIFICATOR_DB_PASSWORD}
      MANAGER_DB_USER: ${MANAGER_DB_USER}
      MANAGER_DB_PASSWORD: ${MANAGER_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./notificator/db:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: 0XAV_ZgyQYuHBnXa-cEFdg
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.1.0
    command: ["sh", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  manager:
    build: ./manager
    environment:
      DB_HOST: mariadb
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MANAGER_DB_USER}
      DB_PASSWORD: ${MANAGER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9290:9290"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  mariadb-data:
  kafka-data:
