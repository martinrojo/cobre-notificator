services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      NOTIFICATOR_DB_USER: ${NOTIFICATOR_DB_USER}
      NOTIFICATOR_DB_PASSWORD: ${NOTIFICATOR_DB_PASSWORD}
      MANAGER_DB_USER: ${MANAGER_DB_USER}
      MANAGER_DB_PASSWORD: ${MANAGER_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./notificator/db:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: 0XAV_ZgyQYuHBnXa-cEFdg
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.1.0
    command: ["sh", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  manager:
    build: ./manager
    environment:
      DB_HOST: mariadb
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MANAGER_DB_USER}
      DB_PASSWORD: ${MANAGER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9290:9290"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notificator:
    build: ./notificator
    environment:
      DB_HOST: mariadb
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${NOTIFICATOR_DB_USER}
      DB_PASSWORD: ${NOTIFICATOR_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHOOK_CONNECT_TIMEOUT: ${WEBHOOK_CONNECT_TIMEOUT:-250ms}
      WEBHOOK_READ_TIMEOUT: ${WEBHOOK_READ_TIMEOUT:-500ms}
      # First retry delay (then x5, x25); lower it only to watch retries live.
      RETRY_DELAY: ${RETRY_DELAY:-60s}
      # Below the 60s first retry delay, so each wave of retries probes the webhook.
      CIRCUIT_OPEN_WAIT: 30s
      # Circuit profile per client. JSON, not RESILIENCE4J_..._INSTANCES_CLIENT008_... env vars:
      # Spring lowercases map keys from env vars, and the breaker name must match the client_id.
      SPRING_APPLICATION_JSON: '{"resilience4j":{"circuitbreaker":{"instances":{"CLIENT008":{"base-config":"bajo-volumen"}}}}}'
      # Local webhooks run without TLS; never enable in production.
      WEBHOOK_ALLOW_HTTP: "true"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Simulates the platform producing transactions.events.v1. Opt-in: docker compose --profile simulator up
  transaction-simulator:
    build: ./transaction-simulator
    profiles: [simulator]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SIMULATOR_EVENTS_PER_MINUTE: ${SIMULATOR_EVENTS_PER_MINUTE:-3000}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Receives the webhooks of the seeded subscriptions (notificator/db/04-seed-subscriptions.sql).
  # Its /config API has no auth: published on localhost only.
  webhook-mock:
    build: ./webhook-mock
    ports:
      - "127.0.0.1:8090:8090"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki

  # Reads container logs through the Docker socket (root-equivalent): local only, no published ports.
  alloy:
    image: grafana/alloy:v1.10.0
    # Listens on all interfaces so Prometheus can scrape the Kafka exporter; not published.
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
      # The Kafka exporter fails Alloy's initial load if the broker is not reachable yet.
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  mariadb-data:
  kafka-data:
  prometheus-data:
  loki-data:
  grafana-data:
