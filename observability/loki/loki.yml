# Local single-binary Loki; no auth and no retention. Not for production.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Only Alloy's app/level labels. The auto service_name label clashes with the JSON
  # service.name field under `| json` and Loki 3.5 then rewrites the returned line.
  discover_service_name: []
